name: Firebase Hosting Preview

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

concurrency:
  group: firebase-hosting-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Instalar dependências
        run: corepack pnpm install --frozen-lockfile
      - name: Gerar build web
        env:
          IS_INTERNAL_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          VITE_LOG_LEVEL: info
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: |
          if [[ "$IS_INTERNAL_PR" == true ]]; then
            : "${VITE_FIREBASE_API_KEY:?Configure VITE_FIREBASE_API_KEY no GitHub Actions}"
            : "${VITE_FIREBASE_PROJECT_ID:?Configure VITE_FIREBASE_PROJECT_ID no GitHub Actions}"
          fi
          corepack pnpm build
          test -s apps/mobile/dist/index.html
      - name: Publicar prévia
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ github.token }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HINARIO_IDC }}
          projectId: hinario-idc
          expires: 7d
