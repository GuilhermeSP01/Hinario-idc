name: Hymns Pipeline CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_ENV: test
  LOG_LEVEL: INFO

permissions:
  contents: read

concurrency:
  group: hymns-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: |
          python -m venv apps/hymns-pipeline/.venv
          apps/hymns-pipeline/.venv/bin/python -m pip install -r apps/hymns-pipeline/requirements.lock
          echo "$GITHUB_WORKSPACE/apps/hymns-pipeline/.venv/bin" >> "$GITHUB_PATH"
          corepack pnpm install --frozen-lockfile
      - name: Validar contratos, camadas e seed offline
        run: |
          corepack pnpm logs:test
          corepack pnpm contracts:check
          corepack pnpm --filter @hinario/hymns-contracts test
          corepack pnpm hymns:test
          python apps/hymns-pipeline/run.py check 2> "$RUNNER_TEMP/hymns-check.jsonl"
          python -m unittest discover -s infra/observability/tests -v
          corepack pnpm --filter @hinario/hymns-contracts validate --all
      - name: Validar consumidores TypeScript
        run: |
          corepack pnpm typecheck
          corepack pnpm build
      - name: Validar identidade e renumeração no navegador
        run: |
          corepack pnpm exec playwright install --with-deps chromium
          corepack pnpm hymns:browser-test
      - name: Confirmar que validação não modifica artefatos rastreados
        run: git diff --exit-code

      - name: Mostrar logs e resumo da verificação
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/hymns-check.jsonl" ]]; then
            cat "$RUNNER_TEMP/hymns-check.jsonl"
            python infra/observability/summarize.py "$RUNNER_TEMP/hymns-check.jsonl" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Guardar logs do check executado no CI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hymns-check-events
          path: ${{ runner.temp }}/hymns-check.jsonl
          if-no-files-found: ignore
          retention-days: 3
