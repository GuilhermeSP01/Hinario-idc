# Only known route categories are logged; query strings and arbitrary paths are omitted.
map $request_uri $log_path {
    default /other;
    ~^/(?:\?|$) /;
    ~^/hymn(?:\?|$) /hymn;
    ~^/favorites(?:\?|$) /favorites;
    ~^/settings(?:\?|$) /settings;
    ~^/assets/ /assets/*;
}
map $request_method $log_method {
    default OTHER;
    GET GET;
    HEAD HEAD;
    POST POST;
    PUT PUT;
    PATCH PATCH;
    DELETE DELETE;
    OPTIONS OPTIONS;
}
log_format application_json escape=json
    '{"timestamp":"$time_iso8601","level":"info","component":"web",'
    '"event":"http.request.completed","requestId":"$request_id",'
    '"context":{"method":"$log_method","path":"$log_path",'
    '"status":$status,"durationSeconds":$request_time,"responseBytes":$body_bytes_sent}}';
# Native Nginx error output is textual and has different privacy properties; see docs.
error_log /dev/stderr warn;

server {
    listen 8080;
    access_log /dev/stdout application_json;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    log_not_found off;
    add_header X-Request-ID $request_id always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Request-ID $request_id always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Request-ID $request_id always;
    }
}
