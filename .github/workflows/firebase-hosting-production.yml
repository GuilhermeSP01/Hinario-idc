name: Firebase Hosting Production

on:
  push:
    branches: [main]

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Instalar dependências
        run: corepack pnpm install --frozen-lockfile
      - name: Gerar build web
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: |
          : "${VITE_FIREBASE_API_KEY:?Configure VITE_FIREBASE_API_KEY no GitHub Actions}"
          : "${VITE_FIREBASE_PROJECT_ID:?Configure VITE_FIREBASE_PROJECT_ID no GitHub Actions}"
          corepack pnpm build
          test -s apps/mobile/dist/index.html
      - name: Publicar em produção
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HINARIO_IDC }}
          projectId: hinario-idc
          channelId: live
