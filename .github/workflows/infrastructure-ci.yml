name: Infrastructure CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependências e gerar build
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm build
      - name: Validar configuração e emuladores Firebase
        run: |
          corepack pnpm infra:check
          corepack pnpm infra:test

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [mobile, hymns-pipeline]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Construir imagem
        env:
          APP: ${{ matrix.app }}
        run: docker build -f "apps/$APP/Dockerfile" -t "hinario-$APP:ci" .
      - name: Validar pipeline no container
        if: matrix.app == 'hymns-pipeline'
        run: |
          docker run --rm hinario-hymns-pipeline:ci
          docker run --rm --entrypoint python hinario-hymns-pipeline:ci \
            -m unittest discover -s apps/hymns-pipeline/tests -v
      - name: Validar servidor web no container
        if: matrix.app == 'mobile'
        run: |
          docker run -d --name hinario-web-ci -p 127.0.0.1:8090:8080 hinario-mobile:ci
          trap 'docker rm -f hinario-web-ci' EXIT
          node infra/docker/web-smoke.mjs
      - name: Validar target de desenvolvimento web
        if: matrix.app == 'mobile'
        run: |
          docker build --target development -f apps/mobile/Dockerfile -t hinario-web-dev:ci .
          docker run -d --name hinario-web-dev-ci -p 127.0.0.1:5173:5173 hinario-web-dev:ci
          trap 'docker rm -f hinario-web-dev-ci' EXIT
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:5173/
